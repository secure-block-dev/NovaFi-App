<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Runs before any bundled script (including CRA's dev error overlay), so
      // it registers first and can stop propagation for window/unhandledrejection
      // errors thrown by browser extensions (wallet extensions injecting into
      // the page, e.g. window.tron/window.ethereum conflicts) before the
      // overlay's own listener sees them. Real app errors are untouched.
      (function () {
        var EXTENSION_ORIGIN = /^(chrome|moz|safari-web|ms-browser)-extension:\/\//;
        window.addEventListener(
          "error",
          function (event) {
            var stack = event.error && event.error.stack;
            if (EXTENSION_ORIGIN.test(event.filename || "") || EXTENSION_ORIGIN.test(stack || "")) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            var stack = event.reason && event.reason.stack;
            if (EXTENSION_ORIGIN.test(stack || "")) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();

      // Lazy-loaded chunks (e.g. RainbowKit/WalletConnect's "official modal"
      // bundle) 404 whenever the tab's bundle.js references a chunk hash that
      // no longer exists on the server — after a new deploy, or a dev-server
      // restart. Rather than leaving the user stuck on a dead error, reload
      // once to pick up the current build. Throttled to avoid a reload loop
      // if the failure is a real, persistent one instead of a stale-hash blip.
      (function () {
        var RELOAD_KEY = "novafi:chunk-reload-at";
        var THROTTLE_MS = 10000;
        function isChunkLoadError(err) {
          if (!err) return false;
          if (err.name === "ChunkLoadError") return true;
          var msg = String(err.message || err);
          return /Loading (chunk|CSS chunk) [\w.-]+ failed/.test(msg);
        }
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            if (!isChunkLoadError(event.reason)) return;
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
            var now = Date.now();
            if (now - last < THROTTLE_MS) return;
            sessionStorage.setItem(RELOAD_KEY, String(now));
            event.preventDefault();
            window.location.reload();
          },
          true
        );
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/logoFN.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03030f" />
    <meta
      name="description"
      content="novaFi — Decentralized DeFi trading platform"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>novaFi</title>
    <link
      href="https://fonts.googleapis.com/css?family=Inter"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
